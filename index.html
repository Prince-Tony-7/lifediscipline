 h+=card('By area',p.areas.length?p.areas.map(function(a){return "<div class='hr'><div class='hl'><b style='color:"+(a.colour==='#f9a825'?'#8a5a00':a.colour)+"'>"+esc(a.area)+"</b><span>"+pct(a.rate)+" "+dlt(a.delta)+"</span></div>"+bar(a.rate,a.colour)+"</div>"}).join(""):"<p class='mut'>No entries this month yet.</p>");
 h+=card('Every habit · this month',p.habits.map(function(x){return "<div class='hr'><div class='hl'><span>"+x.icon+" "+esc(x.label)+"</span><span><b>"+pct(x.rate)+"</b> "+dlt(x.delta)+"</span></div>"+bar(x.rate,x.colour)+"<div class='mut sm'>"+x.done+"/"+x.recorded+" days"+(x.streak?" · 🔥 "+x.streak+" in a row":"")+(x.best>=3?" · best ever "+x.best:"")+"</div></div>"}).join("")||"<p class='mut'>No entries this month yet.</p>");
 var sl=[];if(p.sleep)sl.push("🌙 Bedtime avg <b>"+p.sleep.avg+"</b>"+(p.sleep.prev?" (was "+p.sleep.prev+")":"")+" · on time "+p.sleep.hit+"/"+p.sleep.n+" · latest "+p.sleep.latest);
 if(p.wake)sl.push("⏰ Wake-up avg <b>"+p.wake.avg+"</b>"+(p.wake.prev?" (was "+p.wake.prev+")":"")+" · on time "+p.wake.hit+"/"+p.wake.n);
 if(p.adoration)sl.push("🕯️ <b>"+p.adoration.total+"</b> in adoration · avg "+p.adoration.avg+" · full hour on "+p.adoration.hourDays+" days");
 if(sl.length)h+=card('Sleep, wake-up & adoration',"<ul class='pl'>"+sl.map(function(t){return "<li>"+t+"</li>"}).join("")+"</ul>");
 h+=card('Week by week',p.weeks.map(function(w){return "<div class='hr'><div class='hl'><span>"+esc(w.label)+"</span><span>"+(w.avg==null?"<span class='mut'>not logged</span>":pct(w.avg)+" <span class='mut sm'>("+w.logged+"d)</span>")+"</span></div>"+bar(w.avg,'#455a64')+"</div>"}).join("")+
  (p.bestWeekday?"<p class='sm'>Strongest: <b>"+p.bestWeekday.day+"s</b> ("+pct(p.bestWeekday.avg)+")"+(p.worstWeekday?" · weakest: <b>"+p.worstWeekday.day+"s</b> ("+pct(p.worstWeekday.avg)+")":"")+"</p>":"")+
  (p.bestDay?"<p class='sm'>Best day: <b>"+p.bestDay.date+"</b> "+pct(p.bestDay.score)+(p.worstDay?" · toughest: <b>"+p.worstDay.date+"</b> "+pct(p.worstDay.score):"")+"</p>":""));
 var gl=function(a){return a.map(function(g){return "<li><span class='mut sm'>"+esc(g.date)+"</span> "+esc(g.text)+"</li>"}).join("")};
 if(p.gratitude.length||p.selfGratitude.length)h+=card('💛 Recent gratitude',(p.gratitude.length?"<ul class='pl'>"+gl(p.gratitude)+"</ul>":"")+(p.selfGratitude.length?"<p class='sm'><b>🌱 About myself</b></p><ul class='pl'>"+gl(p.selfGratitude)+"</ul>":""));
 $('main').innerHTML=h;
